# Benchmark — Configuration N-run

## Agents
| ID | Agent | Description |
|----|-------|-------------|
| A0 | Linear AC | Cerebellum (hidden=0), ε=0.1, lr=0.01 |
| A1 | MLP AC | Cerebellum (hidden=64), ε=0.1, lr=0.01 |
| A2 | DQN | Q-network (hidden=64), ε=0.1, lr=0.001 |
| A3 | TSO attracteur | TsoEngine, attractor=true, autres=false |
| A4 | TSO VAE | TsoEngine, attractor=true, use_fpi=false |
| A5 | TSO FPI | TsoEngine, attractor=true, use_fpi=true |
| A6 | TSO full | Tous sous-systèmes activés |
| A7 | TSO gating ON | Même que A6 + phi_gating=true |

