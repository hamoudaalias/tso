[package]
name = "tso-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
ndarray = { version = "0.16", features = ["serde"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
ctrlc = "3.4"
pyo3 = { version = "0.29", features = ["auto-initialize"], optional = true }

[features]
default = []
interop = ["pyo3"]
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
pyo3 = { version = "0.29", features = ["auto-initialize"], optional = true }

[features]
default = []
interop = ["pyo3"]
