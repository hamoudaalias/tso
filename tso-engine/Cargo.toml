[package]
name = "tso-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
ndarray = { version = "0.16", features = ["serde"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
ctrlc = "3.4"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
image = { version = "0.25", optional = true }

[dev-dependencies]
pyo3 = { version = "0.29", features = ["auto-initialize"] }

[features]
default = ["cognitive-cycle"]
cognitive-cycle = []
active-inference = []
interop = []
# Subsystem gates — Φ gating degrades reward (d=−0.70), no gain for others.
hypothalamus = []
attention = []
episodic = []
graph_phi = []
# Dead-code gates — modules spéculatifs désactivés par défaut.
rstdp = []

[[bin]]
name = "bench_vs_mlp"
path = "src/bin/bench_vs_mlp.rs"

[[bin]]
name = "bench_prototypes"
path = "src/bin/bench_prototypes.rs"

[[bin]]
name = "bench_dqn"
path = "src/bin/bench_dqn.rs"

[[bin]]
name = "bench_scale"
path = "src/bin/bench_scale.rs"

[[bin]]
name = "bench_all"
path = "src/bin/bench_all.rs"

[[bin]]
name = "bench_ablation"
path = "src/bin/bench_ablation.rs"

[[bin]]
name = "bench_adapt"
path = "src/bin/bench_adapt.rs"

[[bin]]
name = "spike_unverified"
path = "src/bin/spike_unverified.rs"
