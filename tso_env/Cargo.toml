[package]
name = "tso_env"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
ndarray = { version = "0.16", features = ["serde"] }
rand = "0.8"
tso-engine = { path = "../tso-engine", default-features = false }
